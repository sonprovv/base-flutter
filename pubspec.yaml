name: flutter_app_factory_base
description: BabyGenie – Flutter conversion of GL065-BabyGenie Android app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.1
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.3.0
  smooth_page_indicator: ^1.2.0
  visibility_detector: ^0.4.0
  video_player: ^2.9.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/config/
    - assets/images/
    - assets/data/
